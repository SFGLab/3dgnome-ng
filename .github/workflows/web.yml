name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "gnome3d/**", "pyproject.toml", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "gnome3d/**", "pyproject.toml", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web/requirements.txt
            web/requirements-dev.txt
      # hic-straw has no wheel for this Python and is compiled against libcurl. The site reads a
      # VCF through tabix.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev tabix
      # The tests start the stand in engine with the interpreter of .venv at the repository root.
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e . -r web/requirements.txt -r web/requirements-dev.txt
      - name: Run the test scripts
        run: |
          failed=""
          for t in web/tests/test_*.py; do
            echo "::group::$t"
            .venv/bin/python "$t" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      # One dependency of the lockfile is a GitHub repository at its ssh address.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
