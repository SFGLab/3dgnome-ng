name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "gnome3d/**", "pyproject.toml", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "gnome3d/**", "pyproject.toml", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web/requirements.txt
            web/requirements-dev.txt
      # hic-straw has no wheel for this Python and is compiled against libcurl. The site reads a
      # VCF through tabix.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev tabix
      - run: pip install -e . -r web/requirements.txt -r web/requirements-dev.txt
      # The rules of undefined and unused names. The files of the site are not formatted by ruff.
      - run: pip install ruff==0.15.14
      - run: ruff check --select F web/gnome3d_web web/tests web/scripts
      # The types of the server code, the declared shapes of its answers among them.
      - run: pip install pyright==1.1.409
      - run: pyright -p web/pyrightconfig.json
      - run: pytest web/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      # One dependency of the lockfile is a GitHub repository at its ssh address.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
