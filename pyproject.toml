[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnome3d-ng"
version = "0.2.0"
description = "3dgnome reimplementation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "numba>=0.59.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
]

# JAX backend for the smooth-MC hot path (settings.mc_backend = 'jax').
# Gives 5-30x speedup over numba at N>=2048 on NVIDIA hardware.
# This extras installs jax with CPU-only support; for GPU performance install
# hardware-specific wheels separately, e.g.:
#     pip install gnome3d-ng[jax] "jax[cuda12]"   # NVIDIA
#     pip install gnome3d-ng[jax] "jax[rocm6]"    # AMD
jax = [
    "jax>=0.4.30",
]

# Validation harness (validation/): structure-quality metrics, Hi-C correlation,
# and the EV/confinement hyperparameter sweep. Needs SciPy for stats, cooler to
# read 4DN Hi-C .mcool matrices, and hicrep for the stratum-adjusted SCC.
#     pip install -e .[validation]
validation = [
    "scipy>=1.10",
    "cooler>=0.9",
    "cooltools>=0.7",
    "hicrep>=0.2.6",
    "pyBigWig>=0.3.18",
]

[project.scripts]
gnome3d-ng = "gnome3d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnome3d*"]

[tool.pyright]
include = ["gnome3d"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
pythonVersion = "3.11"
pythonPlatform = "Darwin"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportConstantRedefinition = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["3dnome", ".venv", "build", "dist", "out", "data", "playground"]
# Honor the excludes even when a path is passed explicitly (e.g. pre-commit / editors),
# so playground/ scratch scripts are never linted.
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "TID"]
ignore = [
    "E501",  # line length
    "E731",  # lambda assigns
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Star-imports of the public type aliases are intentional in these modules
"gnome3d/io.py" = ["F405", "F403"]
"gnome3d/data.py" = ["F405", "F403", "B023"]
"gnome3d/hierarchy.py" = ["F405", "F403"]
"gnome3d/pipeline/coarse/build.py" = ["F405", "F403"]
"gnome3d/mc/jax/util.py" = ["F401"]
"validation/metrics/__init__.py" = ["F405", "F403"]

# The harness uses tight one-liner stubs (lots of `;`), tuple short names like
# `l` for length, and zip() without strict=. These are intentional for compact
# test fixtures, not real code.
"harness/integration.py" = ["B007", "B905"]
