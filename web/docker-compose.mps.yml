# The engines of the workers on the NVIDIA MPS daemon of the host. Use with docker-compose.yml:
#   nvidia-cuda-mps-control -d          # on the host, once
#   docker compose -f docker-compose.yml -f docker-compose.mps.yml up -d
# The workers share the IPC namespace of the host and the pipe directory of the daemon, /tmp/nvidia-
# mps or MPS_PIPE_DIRECTORY. A daemon started without root serves its own user alone. MPS_USER=$(id
# -u):$(id -g) runs the web process and the workers as that user.
x-mps: &mps
  ipc: host
  user: "${MPS_USER:-0:0}"
  environment:
    CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
    # The image's source directory belongs to root. Numba keeps its cache next to the results.
    NUMBA_CACHE_DIR: /results/.numba-cache
  volumes:
    - "${MPS_PIPE_DIRECTORY:-/tmp/nvidia-mps}:/tmp/nvidia-mps"

services:
  web:
    user: "${MPS_USER:-0:0}"
  worker-gpu0: *mps
  worker-gpu1: *mps
