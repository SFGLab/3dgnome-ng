# Laid over the lab page's own compose.yaml, this runs the site on Django 5.2. The database
# needs no migration for it. The admin's static files do change, so collect them after the
# switch, as www-data with nginx's group:
#   docker compose -f compose.yaml -f <this file> up -d --no-build
#   docker compose -f compose.yaml -f <this file> exec -u 33:101 web python manage.py collectstatic --noinput
# The step back is compose.bump.yml in place of this file, and the same collectstatic.
# Do not run migrate. Four migrations have been pending since before 2026 and the first fails
# on a foreign key that names a table users_labmember__old, on Django 4.2 as on 5.2.
services:
  nginx: { image: "labwebpage-nginx:2026-11-18" }
  web: { image: "labwebpage-web:2026-11-18-dj52" }
