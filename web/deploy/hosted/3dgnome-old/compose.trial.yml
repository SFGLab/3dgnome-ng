# A trial copy of the old 3D-GNOME site on its new image, on the loopback. The reference data is
# the running site's, read only. The request directory and the box plots are copies, and the
# database is a dump of the running one in a volume of its own. db.env holds the database's name,
# user and password as the site's config.py has them, see make_db_env.sh.
#   docker compose -f compose.trial.yml up -d
name: gnome3d-old-trial
services:
  db:
    image: mariadb:11.8.9
    env_file: [db.env]
    environment: { MARIADB_RANDOM_ROOT_PASSWORD: "1" }
    volumes: ["dbdata:/var/lib/mysql"]
  web:
    image: 3dgnome_webserver:2026-11-18.2
    ports: ["127.0.0.1:8776:8000"]
    depends_on: [db]
    volumes:
      - /home/gnome/3dgnome_data/data_hg38/:/home/3dgnome_webserver/app/static/data_svs/data_hg38/:ro
      - /home/gnome/3dgnome_data/browser_data/:/home/3dgnome_webserver/app/static/browser_data/:ro
      - /home/gnome/3dgnome_data/data_vcf_modified/:/home/3dgnome_webserver/app/static/data_vcf_modified/:ro
      - /home/gnome/3dgnome_data/data_enhancer3D/:/home/3dgnome_webserver/app/static/enhancer3D/:ro
      - ./trial/data:/home/3dgnome_webserver/app/static/data
      - ./trial/boxplots:/boxplots
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
volumes:
  dbdata:
