# Laid over spring-model's own compose.yaml, this runs the site on the rebuilt image and on
# current patch releases of nginx, Redis and PostgreSQL 16. The data directories are unchanged.
#   docker compose -f compose.yaml -f <this file> up -d --no-build
# The step back is the same command without this file.
services:
  django: { image: "sm_webservice-django:2026-11-18" }
  worker: { image: "sm_webservice-django:2026-11-18" }
  nginx: { image: "nginx:1.30.6-alpine" }
  redis: { image: "redis:7.2.17-alpine" }
  db: { image: "postgres:16.16-alpine" }
