# The site and the engine in one container. Jobs run in the web process, WORKERS_PER_GPU at once on
# each card of GPUS. Run from web/.
#   SITE_ROOT=/srv/3dgnome BASE_PATH=/new PORT=8770 GPUS=0,1 WORKERS_PER_GPU=2 \
#     SITE_USER=$(id -u):$(id -g) docker compose -f docker-compose.single.yml up -d --build
# SITE_ROOT holds data/ for the container to read and results/ for it to write as SITE_USER. The
# port is bound to the loopback of the host. A job that waits in the queue is lost when the
# container stops. A path of the catalog must exist inside the container. A set kept elsewhere is
# mounted below /data in an override file.
#   services: { site: { volumes: ["/srv/tbooo/release:/data/svs/tbooo:ro"] } }
name: gnome3d-site
services:
  site:
    build: { context: .., dockerfile: web/Dockerfile, args: { GPU: "${GPU:-1}", BASE_PATH: "${BASE_PATH:-}", HICDIFFUSION: "${HICDIFFUSION:-1}", GNOME3D_VERSION: "${GNOME3D_VERSION:-0.0.0}" } }
    image: "${IMAGE:-gnome3d-web}"
    restart: unless-stopped
    user: "${SITE_USER:-0:0}"
    ports: ["127.0.0.1:${PORT:-8000}:8000"]
    environment:
      QUEUE: thread
      # The workers of the site, see design/website/settings.md. An empty value keeps its default.
      GPUS: "${GPUS:-0}"
      WORKERS_PER_GPU: "${WORKERS_PER_GPU:-1}"
      WORKER_CORES: "${WORKER_CORES:-}"
      GPU_POOL_GIB: "${GPU_POOL_GIB:-}"
      # The site does not start with this variable set. Its message gives
      # GPUS and WORKERS_PER_GPU in its place.
      GPU_SLOTS: "${GPU_SLOTS:-}"
      BASE_PATH: "${BASE_PATH:-}"
      # The address of the host as a reader types it, for the canonical links and the sitemap.
      PUBLIC_URL: "${PUBLIC_URL:-}"
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
      MAX_REGION_MB: "${MAX_REGION_MB:-20}"
      # The image's source directory belongs to root. The caches go next to the results.
      NUMBA_CACHE_DIR: /results/.numba-cache
      HOME: /results/.home
    volumes:
      - "${SITE_ROOT:?set SITE_ROOT to the directory that holds data/ and results/}/data:/data:ro"
      - "${SITE_ROOT}/results:/results"
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
