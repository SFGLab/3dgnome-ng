# Web, one worker and Redis. Run from web/:
#   DATA_DIR=/srv/gnome3d/data RESULTS_DIR=/srv/gnome3d/results docker compose up -d --build
# The worker asks for one GPU. On a machine without one, drop the deploy block and set the configs
# of the cell types to the serial executor, see design/website/deployment.md.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: web/Dockerfile, args: { GPU: "${GPU:-1}", BASE_PATH: "${BASE_PATH:-}", HICDIFFUSION: "${HICDIFFUSION:-1}", GNOME3D_VERSION: "${GNOME3D_VERSION:-0.0.0}" } }
    image: gnome3d-web
    restart: unless-stopped
    ports: ["${PORT:-8000}:8000"]
    environment:
      QUEUE: rq
      BASE_PATH: "${BASE_PATH:-}"
      REDIS_URL: redis://redis:6379/0
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
    volumes:
      - "${DATA_DIR:-./site-data}:/data:ro"
      - "${RESULTS_DIR:-./site-results}:/results"
    depends_on: [redis]

  # One worker group per card with WORKERS_PER_GPU workers each. A worker reads the same variables
  # as the site of docker-compose.single.yml for its GPU memory pool. See design/website/settings.md.
  worker-gpu0: &worker
    image: gnome3d-web
    restart: unless-stopped
    command: ["rq", "worker", "gnome3d", "--url", "redis://redis:6379/0"]
    environment:
      QUEUE: rq
      # The two worker groups below are the two cards. A worker counts the slots of the server from these.
      GPUS: "${GPUS:-0,1}"
      WORKERS_PER_GPU: "${WORKERS_PER_GPU:-1}"
      WORKER_CORES: "${WORKER_CORES:-}"
      GPU_POOL_GIB: "${GPU_POOL_GIB:-}"
      REDIS_URL: redis://redis:6379/0
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
    volumes:
      - "${DATA_DIR:-./site-data}:/data:ro"
      - "${RESULTS_DIR:-./site-results}:/results"
    depends_on: [redis, web]
    deploy:
      replicas: ${WORKERS_PER_GPU:-1}
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["0"], capabilities: [gpu] }]

  worker-gpu1:
    <<: *worker
    deploy:
      replicas: ${WORKERS_PER_GPU:-1}
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["1"], capabilities: [gpu] }]
