# Web, one worker and Redis. Run from web/:
#   DATA_DIR=/srv/gnome3d/data RESULTS_DIR=/srv/gnome3d/results docker compose up -d --build
# The worker asks for one GPU; drop the deploy block on a machine without one and set the
# cell types' configs to the serial executor, see README.md.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: web/Dockerfile, args: { GPU: "${GPU:-1}", BASE_PATH: "${BASE_PATH:-}" } }
    image: gnome3d-web
    restart: unless-stopped
    ports: ["${PORT:-8000}:8000"]
    environment:
      QUEUE: rq
      BASE_PATH: "${BASE_PATH:-}"
      REDIS_URL: redis://redis:6379/0
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
    volumes:
      - "${DATA_DIR:-./site-data}:/data:ro"
      - "${RESULTS_DIR:-./site-results}:/results"
    depends_on: [redis]

  # One worker group per GPU, each worker pinned to its card with a fixed memory pool. A 20 Mb
  # job of 10 structures needs 0.65 GiB. See README.md for the measurements.
  worker-gpu0: &worker
    image: gnome3d-web
    restart: unless-stopped
    command: ["rq", "worker", "gnome3d", "--url", "redis://redis:6379/0"]
    environment:
      QUEUE: rq
      GNOME3D_GPU_POOL_GIB: "${GPU_POOL_GIB:-1.5}"
      REDIS_URL: redis://redis:6379/0
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
    volumes:
      - "${DATA_DIR:-./site-data}:/data:ro"
      - "${RESULTS_DIR:-./site-results}:/results"
    depends_on: [redis, web]
    deploy:
      replicas: ${WORKERS_PER_GPU:-2}
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["0"], capabilities: [gpu] }]

  worker-gpu1:
    <<: *worker
    deploy:
      replicas: ${WORKERS_PER_GPU:-2}
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["1"], capabilities: [gpu] }]
