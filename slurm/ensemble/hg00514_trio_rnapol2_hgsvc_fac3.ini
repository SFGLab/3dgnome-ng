# HG00514 (child, CHS) trio ensemble. TAD blocks, CTCF anchors from the CTCF site filtered
# ChIA-PET loops, ChIA-PET derived contact singletons, distance map, dynamic subanchors,
# excluded volume. Epigenome terms off. Generated by playground/trio/trio_configs.py from
# validation.core.config.CANONICAL; edit that and regenerate rather than editing this file.
#
# The contact map here is built by juicer from this sample's own ChIA-PET pairs, so the TAD
# blocks and the singletons are not independent of the loops the model fits. That differs from
# the three cell line arm, where the Hi-C came from 4DN.
#
# RNAPOL2 arm. The sample's RNAPOL2 ChIA-PET loops are a second cluster file with their own
# strength fit, held at the multiplier in [springs] factor_strength; its loop ends that sit on
# no CTCF anchor are anchors of no orientation. On GM12878 chr1 the pull carried the expression
# signal and the anchor set carried the Hi-C cost whatever the strength, so the loops are at
# full strength, design/rnapii-loops.md.
#
# Contact singletons from the HGSVC Hi-C of this individual, the 4DN mcool at 25 kb thinned by
# slurm/ensemble/prep_singletons.py as the cell lines' maps are. The ChIA-PET derived map holds
# nothing the loops do not, and this one is an independent experiment,
# design/expression-from-structure.md.

[main]
output_level = 1
random_walk = no
loop_density = 5
use_2d = no
max_pet_length = 1000000
long_pet_power = 2.0
long_pet_scale = 1.0
steps_lvl1 = 1
steps_lvl2 = 1
steps_arcs = 1
steps_smooth = 1
noise_lvl1 = 0.5
noise_lvl2 = 0.5
noise_smooth = 1.0
overlap_anchor_strict = no
drop_zero_length_subanchors = yes
use_dynamic_loop_density = yes
target_bp_per_subanchor = 1000
min_subanchors_per_arc = 0
max_subanchors_per_arc = 100

[motif_orientation]
use_motif_orientation = yes
weight = 50.0

[anchor_heatmap]
use_anchor_heatmap = yes
heatmap_influence = 0.1

[subanchor_heatmap]
use_subanchor_heatmap = no
estimate_distances_steps = 4
estimate_distances_replicates = 4
heatmap_influence = 0.1
heatmap_dist_weight = 0.01
heat_min_reduction = 0.001

[heatmaps]
inter_scaling = 1.0
distance_heatmap_stretching = 2.5

[springs]
background_weight = 0.1
background_range_bp = 100000
use_contact_background = yes
stretch_constant = 0.1
squeeze_constant = 0.1
angular_constant = 0.1
stretch_constant_arcs = 1.0
squeeze_constant_arcs = 1.0
factor_strength = 1,1

[simulation_backend]
ib_workers = auto
heatmap_chains = 1
smooth_chains = 1
mc_executor_arcs = batch
mc_executor_densify = threaded
mc_executor_estimate_dist = batch
mc_executor_smooth = batch
neighbour_grid = yes
multigpu_mode = groups
mc_executor_jax_bucket_shapes = yes

[simulation_ib]
use_ib_mc = yes
max_temp = 5.0
jump_temp_scale = 50.0
jump_temp_coef = 20.0
delta_temp = 0.9999
stop_condition_improvement_threshold = 0.999
stop_condition_successes_threshold = 100
stop_condition_steps = 50000

[simulation_heatmap]
max_temp_heatmap = 5.0
delta_temp_heatmap = 0.9999
jump_temp_scale_heatmap = 50.0
jump_temp_coef_heatmap = 20.0
stop_condition_improvement_threshold_heatmap = 0.999
stop_condition_successes_threshold_heatmap = 10
stop_condition_steps_heatmap = 50000

[simulation_arcs]
solver = lbfgs
solver_tol = 1e-06
solver_iters = 5000
scope = chromosome
start = hilbert
max_temp = 5.0
jump_temp_scale = 50.0
jump_temp_coef = 20.0
delta_temp = 0.9999
stop_condition_improvement_threshold = 0.999
stop_condition_successes_threshold = 100
stop_condition_steps = 50000

[simulation_arcs_smooth]
dist_weight = 1.0
angle_weight = 1.0
max_temp = 5.0
jump_temp_scale = 50.0
jump_temp_coef = 20.0
delta_temp = 0.9999
stop_condition_improvement_threshold = 0.999
stop_condition_successes_threshold = 50
stop_condition_steps = 50000
start = coil
hard_wall = yes
prefetch = 32
jax_grid = yes
anchor_cap = 0.0

[excluded_volume]
use_excluded_volume = yes
weight = 0.1
auto_factor_smooth = 0.7
apply_to_heatmap = yes
apply_to_arcs = yes
apply_to_smooth = yes
arcs_repulsion_cutoff_factor = 1.5

[confinement]
use_confinement = yes
weight = 0.1
apply_to_arcs = yes
weight_arcs = 0
packing_factor_arcs = 0
apply_to_smooth = yes
apply_to_ib = yes
packing_factor_ib = 0.75

[boundary_stitch]
use_boundary_stitch = no

[relax]
use_cross_block_relax = no
local_window = 1

[data]
data_dir = data/HG00514
anchors = HG00514_anchors_ctcf_rnapol2.bed
clusters = HG00514_clusters_3+.bedpe,HG00514_rnapol2_clusters_3+.bedpe
singletons = HG00514_hgsvc_25kb_singletons.bedpe
singletons_inter = 
segment_split = HG00514_segments.bed
centromeres = hg38_centromeres.bed
factors = CTCF,RNAPOL2
anchor_activity = HG00514_rnapol2_peaks.broadPeak

[factories]
weight = 3

