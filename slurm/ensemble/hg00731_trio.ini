# HG00731 (father, PUR) trio ensemble. TAD blocks, CTCF anchors from the CTCF site filtered
# ChIA-PET loops, ChIA-PET derived contact singletons, distance map, dynamic subanchors,
# excluded volume. Epigenome terms off. Generated by playground/trio/trio_configs.py from
# validation.core.config.CANONICAL; edit that and regenerate rather than editing this file.
#
# The contact map here is built by juicer from this sample's own ChIA-PET pairs, so the TAD
# blocks and the singletons are not independent of the loops the model fits. That differs from
# the three cell line arm, where the Hi-C came from 4DN.

[main]
output_level = 1
random_walk = no
loop_density = 5
use_2d = no
max_pet_length = 1000000
long_pet_power = 2.0
long_pet_scale = 1.0
steps_lvl1 = 1
steps_lvl2 = 1
steps_arcs = 1
steps_smooth = 1
noise_lvl1 = 0.5
noise_lvl2 = 0.5
noise_smooth = 5.0
overlap_anchor_strict = no
drop_zero_length_subanchors = yes
use_dynamic_loop_density = yes
target_bp_per_subanchor = 1000
min_subanchors_per_arc = 0
max_subanchors_per_arc = 100

[distance]
use_separation_arc_target = yes
genomic_dist_power = 0.75
genomic_dist_scale = 0.5
genomic_dist_base = 1.0
freq_dist_scale = 25.0
freq_dist_power = -0.6
freq_dist_scale_inter = 120.0
freq_dist_power_inter = -1.0
count_dist_a = 0.2
count_dist_scale = 1.8
count_dist_shift = 8
count_dist_base_level = 0.2

[template]
template_scale = 7.0
dist_heatmap_scale = 15.0

[motif_orientation]
use_motif_orientation = yes
weight = 50.0

[anchor_heatmap]
use_anchor_heatmap = yes
heatmap_influence = 0.1

[subanchor_heatmap]
use_subanchor_heatmap = yes
estimate_distances_steps = 4
estimate_distances_replicates = 4
heatmap_influence = 0.1
heatmap_dist_weight = 0.01
heat_min_reduction = 0.001

[heatmaps]
inter_scaling = 1.0
distance_heatmap_stretching = 2.5

[springs]
use_arcs_chain_bonds = yes
arcs_chain_bond_scale = 1.5
stretch_constant = 0.1
squeeze_constant = 0.1
angular_constant = 0.1
stretch_constant_arcs = 1.0
squeeze_constant_arcs = 1.0

[simulation_backend]
ib_workers = auto
heatmap_chains = 1
smooth_chains = 1
mc_executor_arcs = threaded
mc_executor_densify = threaded
mc_executor_estimate_dist = batch
mc_executor_smooth = batch
neighbour_grid = yes
multigpu_mode = groups
mc_executor_jax_bucket_shapes = yes

[simulation_ib]
use_ib_mc = yes
max_temp = 5.0
jump_temp_scale = 50.0
jump_temp_coef = 20.0
delta_temp = 0.9999
stop_condition_improvement_threshold = 0.999
stop_condition_successes_threshold = 100
stop_condition_steps = 50000

[simulation_heatmap]
max_temp_heatmap = 5.0
delta_temp_heatmap = 0.9999
jump_temp_scale_heatmap = 50.0
jump_temp_coef_heatmap = 20.0
stop_condition_improvement_threshold_heatmap = 0.999
stop_condition_successes_threshold_heatmap = 10
stop_condition_steps_heatmap = 50000

[simulation_arcs]
max_temp = 5.0
jump_temp_scale = 50.0
jump_temp_coef = 20.0
delta_temp = 0.9999
stop_condition_improvement_threshold = 0.999
stop_condition_successes_threshold = 100
stop_condition_steps = 50000

[simulation_arcs_smooth]
dist_weight = 1.0
angle_weight = 1.0
max_temp = 5.0
jump_temp_scale = 50.0
jump_temp_coef = 20.0
delta_temp = 0.9999
stop_condition_improvement_threshold = 0.999
stop_condition_successes_threshold = 50
stop_condition_steps = 50000

[excluded_volume]
use_excluded_volume = yes
weight = 0.1
auto_factor_smooth = 0.7
apply_to_heatmap = yes
apply_to_arcs = yes
apply_to_smooth = yes
arcs_repulsion_cutoff_factor = 3.0

[confinement]
use_confinement = yes
weight = 0.1
apply_to_arcs = yes
apply_to_smooth = yes
apply_to_ib = yes
packing_factor_ib = 0.75

[boundary_stitch]
use_boundary_stitch = yes

[relax]
use_cross_block_relax = yes

[small_ib_boost]
use_small_ib_boost = no

[data]
data_dir = data/HG00731
anchors = HG00731_anchors_3+_oriented.bed
clusters = HG00731_clusters_3+.bedpe
factors = CTCF
singletons = HG00731_hic_25kb_singletons.bedpe
split_singleton_files_by_chr = no
singletons_inter = 
segment_split = HG00731_segments.bed
centromeres = hg38_centromeres.bed

